<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/logo.png" />
    <title>404</title>
    <!-- =========================================
       GOOGLE FONT
       ========================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================
       LUCIDE ICONS
       ========================================= -->

    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="404.css" />
  </head>
  <body>
    <section class="error-page" id="error-page">
      <!-- =====================================================
       TOP CONTROLS
       ===================================================== -->

      <div class="error-page-controls">
        <button
          type="button"
          class="error-control-btn"
          id="errorRtlToggle"
          aria-label="Toggle RTL"
          title="Toggle RTL"
        >
          <i data-lucide="arrow-left-right" aria-hidden="true"></i>
        </button>

        <button
          type="button"
          class="error-control-btn"
          id="errorThemeToggle"
          aria-label="Toggle dark mode"
          title="Toggle dark mode"
        >
          <i data-lucide="moon" aria-hidden="true"></i>
        </button>
      </div>

      <!-- =====================================================
       MAIN CONTENT
       ===================================================== -->

      <div class="error-page-container">
        <!-- LOGO -->

        <div class="booking-logo">
          <a href="index.html">
            <img
              src="images/logo.png"
              alt="AquaCare Aquarium Setup & Maintenance"
            />
          </a>

          <div class="logo-text" onclick="window.location.href = 'index.html'">
            <h1>
              <span class="ceiling">Ceiling</span
              ><span class="craft">Craft</span>
            </h1>

            <p>CEILING SERVICE MAINTAINCE</p>
          </div>
        </div>

        <!-- EYEBROW -->

        <div class="error-page-eyebrow">
          <span></span>

          <p>PAGE NOT FOUND</p>

          <span></span>
        </div>

        <!-- 404 -->

        <div class="error-page-number">
          <span>4</span>

          <div class="error-page-number-center">
            <i data-lucide="circle" aria-hidden="true"></i>
          </div>

          <span>4</span>
        </div>

        <!-- CONTENT -->

        <div class="error-page-content">
          <h1>
            Looks Like This Ceiling
            <span>Hasn't Been Finished.</span>
          </h1>

          <p>
            The page you're looking for may have moved, been removed, or simply
            doesn't exist anymore. Let's get you back to a space that feels
            right.
          </p>
        </div>

        <!-- ACTIONS -->

        <div class="error-page-actions">
          <a href="index.html" class="error-page-primary">
            <span> Back to Home </span>

            <i data-lucide="arrow-up-right" aria-hidden="true"></i>
          </a>

          <a href="contact.html" class="error-page-secondary">
            <span> Get a Free Estimate </span>

            <i data-lucide="arrow-up-right" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </section>

    <script src="global.js"></script>
    <script src="404.js"></script>
  </body>
</html>
